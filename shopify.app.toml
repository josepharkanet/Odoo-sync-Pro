# This file stores configurations for your Shopify app.

client_id = "8364d84e0b554fc670721e79ccc390cc"
name = "Arkanet Odoo Connector"
application_url = "https://x10n95v5hweacr6mxxvj8p1w.2.24.130.10.sslip.io"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# StockPromise reads per-location inventory + products to compute delivery
# promises, and tags orders / writes the promised delivery date back.
scopes = "read_products,read_inventory,read_locations,read_orders,write_orders"

[auth]
redirect_urls = [
  "https://x10n95v5hweacr6mxxvj8p1w.2.24.130.10.sslip.io/auth/callback",
  "https://x10n95v5hweacr6mxxvj8p1w.2.24.130.10.sslip.io/auth/shopify/callback",
  "https://x10n95v5hweacr6mxxvj8p1w.2.24.130.10.sslip.io/api/auth/callback",
]

[app_proxy]
# Storefront calls /apps/stockpromise/delivery → this app's /delivery route.
# `url` becomes the app URL; `shopify app dev` updates it to the dev tunnel.
url = "https://x10n95v5hweacr6mxxvj8p1w.2.24.130.10.sslip.io"
subpath = "stockpromise"
prefix = "apps"

[webhooks]
api_version = "2025-01"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Webhooks can have filters
  # Only receive webhooks for product updates with a product price >= 10.00
  # See: https://shopify.dev/docs/apps/build/webhooks/customize/filters
  # [[webhooks.subscriptions]]
  # topics = ["products/update"]
  # uri = "/webhooks/products/update"
  # filter = "variants.price:>=10.00"

  # Mandatory compliance topic for public apps only
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/customers/data_request"
  # compliance_topics = ["customers/data_request"]

  # [[webhooks.subscriptions]]
  # uri = "/webhooks/customers/redact"
  # compliance_topics = ["customers/redact"]

  # [[webhooks.subscriptions]]
  # uri = "/webhooks/shop/redact"
  # compliance_topics = ["shop/redact"]
